# Rocketlane Portal-to-Portal Migration
# Copy this file, rename it (e.g. customer_migration.properties),
# fill in the values, and run:
#   python3 migrate_all_with_properties.py --config customer_migration.properties
# Add --dry-run to validate without making changes.

# ============================================================================
# SOURCE PORTAL
# ============================================================================

portal1.name=Source Portal Name
portal1.base.url=https://<subdomain>.rocketlane.com/
portal1.api.base=https://<subdomain>.api.rocketlane.com
portal1.v1.api.base=https://<subdomain>.api.rocketlane.com
portal1.api.key=rl-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
portal1.automation.api.key=rl-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

portal1.endpoint.fields=/api/1.0/fields
portal1.endpoint.field.detail=/api/1.0/fields/{fieldId}
portal1.endpoint.all.fields=/api/v1/all-fields
portal1.endpoint.field.sections=/api/v1/field-sections
portal1.endpoint.roles=/api/v1/roles
portal1.endpoint.skills=/api/v1/skill/fields
portal1.endpoint.users=/api/1.0/users
portal1.endpoint.cost.rates=/api/v1/cost-rates/users/{userId}
portal1.endpoint.templates=/api/v1/templates
portal1.endpoint.template.detail=/api/v1/templates/{templateId}
portal1.endpoint.template.dependencies=/api/v1/templates/dependency-map
portal1.endpoint.automations.global=/api/v1/automations/global
portal1.endpoint.timesheets.configuration=/api/v1/timesheets/configuration
portal1.endpoint.timesheets.categories=/api/v1/timesheets/categories
portal1.endpoint.timesheets.activity=/api/v1/timesheets/activity

# ============================================================================
# DESTINATION PORTAL
# ============================================================================

portal2.name=Destination Portal Name
portal2.base.url=https://<subdomain>.rocketlane.com/
portal2.api.base=https://<subdomain>.api.rocketlane.com
portal2.api.key=rl-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

portal2.endpoint.fields=/api/1.0/fields
portal2.endpoint.field.sections=/api/v1/field-sections
portal2.endpoint.roles=/api/v1/roles
portal2.endpoint.skills=/api/v1/fields
portal2.endpoint.users=/api/v1/subscription/add-agents
portal2.endpoint.templates=/api/v1/templates
portal2.endpoint.template.detail=/api/v1/templates/{templateId}
portal2.endpoint.template.dependencies=/api/v1/templates/dependency-map
portal2.endpoint.automations.global=/api/v1/automations/global
portal2.endpoint.timesheets.configuration=/api/v1/timesheets/configuration
portal2.endpoint.timesheets.categories=/api/v1/timesheets/categories
portal2.endpoint.timesheets.activity=/api/v1/timesheets/activity

# ============================================================================
# MIGRATION FEATURES — set true/false per scope
# ============================================================================

migration.enable.fields=true
migration.enable.fields.project=true
migration.enable.fields.task=true
migration.enable.fields.user=false
migration.enable.fields.company=false

migration.enable.roles=true
migration.enable.templates=true
migration.enable.dependencies=true
migration.enable.automations=true
migration.enable.timesheets=true

migration.enable.skills=false
migration.enable.users=false

# Set to true on a second run (document templates) to load field/role mappings
# written by run 1, so template IDs are remapped correctly.
migration.load.existing.mappings=false

# ============================================================================
# MIGRATION CONFIGURATION
# ============================================================================

# Object types for field migration (comma-separated)
migration.object.types=TASK,PROJECT

migration.choice.field.types=SINGLE_CHOICE,MULTIPLE_CHOICE

# PROJECT for run 1, DOCUMENT for run 2
migration.template.object.type=PROJECT
migration.template.order=PROJECT

# Comma-separated field IDs to exclude from migration (leave blank for none)
migration.excluded.field.ids=

# ============================================================================
# LOGGING — all paths under customer.directory
# ============================================================================

customer.directory=customers/CustomerName

logging.migration.log=customers/CustomerName/migration_log.json
logging.field.mapping=customers/CustomerName/field_mapping.json
logging.section.mapping=customers/CustomerName/section_mapping.json
logging.role.mapping=customers/CustomerName/role_mapping.json
logging.skill.mapping=customers/CustomerName/skill_mapping.json
logging.user.mapping=customers/CustomerName/user_mapping.json
logging.template.mapping=customers/CustomerName/template_mapping.json
logging.dependency.mapping=customers/CustomerName/dependency_mapping.json
logging.automation.mapping=customers/CustomerName/automation_mapping.json
logging.timesheet.mapping=customers/CustomerName/timesheet_mapping.json

# ============================================================================
# RATE LIMITING (seconds between API calls)
# ============================================================================

ratelimit.field.detail.fetch=0.1
ratelimit.field.creation=0.2
ratelimit.field.option.add=0.1
ratelimit.role.creation=0.2
ratelimit.skill.creation=0.2
ratelimit.user.creation=0.3
ratelimit.template.creation=0.2
ratelimit.template.detail.fetch=0.1
ratelimit.automation.creation=0.2
ratelimit.timesheet.creation=0.2
